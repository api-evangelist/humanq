name: HumanQ
description: >-
  HumanQ is an execution-capability and intelligence platform that helps
  organizations move critical work forward through structured, live execution
  sprints called QPods. Each QPod is a 60-minute facilitated session, led by
  trained "Catalysts," for small groups of up to six participants working
  through decision drag, unclear ownership, and cross-team stalls. HumanQ is
  offered as HumanQ Scale (an enterprise-wide program with weekly and monthly
  tracks, on-demand drop-ins, and deep customization) and HumanQ Teams (a
  manager-led tool for up to four groups, live in two weeks with no contract).
  Progress is tracked through the QStart, QImpact, and QSignal measurement
  framework, with delivery across 74 countries. HumanQ is a portfolio company of
  Kindred Ventures. It is a managed-services platform and does not currently
  publish a public API, SDK, or developer documentation surface.
